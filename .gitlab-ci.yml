# References:
# https://gitlab.com/gitlab-org/gitlab-ci-yml/blob/master/Maven.gitlab-ci.yml
# https://maven.apache.org/guides/introduction/introduction-to-the-lifecycle.html

image: bellsoft/liberica-openjdk-debian:11

variables:
  MAVEN_CLI_OPTS: "--show-version \
    --batch-mode \
    -Duser.timezone=Asia/Jakarta \
    -Dhttps.protocols=TLSv1.2 \
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository \
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN \
    -Dorg.slf4j.simpleLogger.showDateTime=true \
    -Djava.awt.headless=true -Dtestfx.robot=glass -Dtestfx.headless=true -Dglass.platform=Monocle -Dmonocle.platform=Headless -Dprism.order=sw -Dprism.text=t2k -Dtestfx.setup.timeout=2500 -Dprism.verbose=true"

cache:
  paths:
    - .m2/repository/

default:
  before_script:
    - apt-get update 
    - apt-get install -y git
    - git --version
    - git remote set-url --push origin "https://${GITLAB_USER_LOGIN}:${READ_WRITE_REPOSITORY_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.name "${GITLAB_USER_NAME}"
    - git config user.email "${GITLAB_USER_EMAIL}"

stages:
  - build
  - test
  - release

build:
  stage: build
  script: ./mvnw $MAVEN_CLI_OPTS spotless:check test-compile -U 
  allow_failure: false
  only:
    - develop

test:
  variables:
    JACOCO_REPORT_HTML: $CI_PROJECT_DIR/target/site/jacoco/index.html
  stage: test
  before_script:
    - apt-get update 
    - apt-get install -y libxtst6 libgtk2.0-0
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
    - if [ -f $JACOCO_REPORT_HTML ]; then cat $JACOCO_REPORT_HTML | grep -o "Total[^%]*%"; fi
  allow_failure: false
  coverage: "/Total.*?([0-9]{1,3})%/"
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
  only:
    - develop

release:
  stage: release
  dependencies:
    - test
  script:
    - ./mvnw $MAVEN_CLI_OPTS gitflow:release
  only:
    - develop
  when: manual
